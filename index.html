<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gael - Pequeno Herói</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#game{
    width:95%;
    max-width:520px;
    background:white;
    padding:20px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

#gael{
    width:130px;
    margin:10px;
}

#message{
    font-size:14px;
    margin-top:10px;
    color:#555;
}

button{
    padding:12px;
    margin:6px;
    border:none;
    border-radius:10px;
    background:#ff6f61;
    color:white;
    font-size:16px;
}

button:hover{
    background:#e64a45;
}

.correct{
    background:green !important;
}

.wrong{
    background:red !important;
}
</style>
</head>

<body>

<div id="game">

<h2 id="title">🌟 Gael - Pequeno Herói</h2>

<img id="gael" src="gael.png">

<p id="story"></p>

<div id="content"></div>

<p id="message"></p>

</div>

<script>

let phase = 1;

function setMessage(text){
    document.getElementById("message").innerText = text;
}

function next(){
    phase++;
    load();
}

function load(){
    const story = document.getElementById("story");
    const content = document.getElementById("content");

    content.innerHTML = "";

    // ===== FASE 1 =====
    if(phase === 1){
        story.innerText = "Gael quer ser um herói! Vamos ajudar ele a tomar boas decisões 💖";

        createQuestion(
            "Correr dentro de casa é seguro?",
            ["SIM","NÃO"],
            "NÃO",
            "Muito bem! Heróis cuidam da segurança 🏠✨"
        );
    }

    // ===== FASE 2 =====
    else if(phase === 2){
        story.innerText = "Ser um herói também é tratar as pessoas com carinho ❤️";

        createQuestion(
            "Devemos respeitar a mamãe?",
            ["SIM","NÃO"],
            "SIM",
            "Isso! O respeito faz a gente ser especial 💕"
        );
    }

    // ===== FASE 3 =====
    else if(phase === 3){
        story.innerText = "Heróis também são inteligentes 🧠";

        createQuestion(
            "Clique na letra G",
            ["A","G","B"],
            "G",
            "Perfeito! Você está aprendendo muito! 🔤"
        );
    }

    // ===== FASE 4 =====
    else if(phase === 4){
        story.innerText = "Ser forte não é brigar, é ser corajoso e gentil 💪";

        createQuestion(
            "Ser forte é bater nos outros?",
            ["SIM","NÃO"],
            "NÃO",
            "Isso! Ser forte é cuidar e proteger 💖"
        );
    }

    // ===== FINAL =====
    else{
        story.innerText = "🏆 Gael virou um verdadeiro herói!";

        content.innerHTML = `
            <h3>Você aprendeu:</h3>
            <p>💖 Amor</p>
            <p>❤️ Respeito</p>
            <p>🧠 Inteligência</p>
            <p>💪 Força do bem</p>
            <button onclick="location.reload()">Jogar novamente</button>
        `;

        setMessage("Você é incrível! ✨");
    }
}

function createQuestion(text, options, correct, successMsg){
    const content = document.getElementById("content");

    let q = document.createElement("p");
    q.innerText = text;

    content.appendChild(q);

    options.forEach(opt=>{
        let btn = document.createElement("button");
        btn.innerText = opt;

        btn.onclick = ()=>{
            if(opt === correct){
                btn.classList.add("correct");
                setMessage(successMsg);
                setTimeout(next,1000);
            }else{
                btn.classList.add("wrong");
                setMessage("Ops! Vamos tentar de novo 💛");
            }
        };

        content.appendChild(btn);
    });
}

load();

</script>

</body>
</html>
