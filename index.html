<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gael Herói 💖</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
<style>
body{ margin:0; }

#controls{
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
}

button{
    font-size:20px;
    padding:15px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:#ff9800;
    color:white;
}
</style>
</head>

<body>

<div id="controls">
    <button onclick="moveLeft()">⬅️</button>
    <button onclick="jump()">⬆️</button>
    <button onclick="moveRight()">➡️</button>
</div>

<script>

let stars = 0;
let player, coins, text;
let moveDir = 0;

// VOZ
function speak(msg){
    let speech = new SpeechSynthesisUtterance(msg);
    speech.lang = "pt-BR";
    speechSynthesis.speak(speech);
}

// CONTROLES MOBILE
function moveLeft(){ moveDir = -1; }
function moveRight(){ moveDir = 1; }
function jump(){
    if(player.body.touching.down){
        player.setVelocityY(-400);
    }
}

const config = {
    type: Phaser.AUTO,
    width: 400,
    height: 600,
    backgroundColor: "#87CEEB",
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 600 } }
    },
    scene: { preload, create, update }
};

new Phaser.Game(config);

function preload(){
    this.load.image('ground','https://labs.phaser.io/assets/sprites/platform.png');
    this.load.image('coin','https://labs.phaser.io/assets/sprites/gold_1.png');
    this.load.image('hero','https://labs.phaser.io/assets/sprites/phaser-dude.png');
}

function create(){

    speak("Vamos lá Gael! Pegue as moedas!");

    const ground = this.physics.add.staticGroup();
    ground.create(200,580,'ground').setScale(2).refreshBody();

    player = this.physics.add.sprite(100,450,'hero');
    player.setScale(1.5); // maior
    player.setCollideWorldBounds(true);

    this.physics.add.collider(player, ground);

    coins = this.physics.add.group();

    for(let i=0;i<6;i++){
        let coin = coins.create(Phaser.Math.Between(50,350),0,'coin');
        coin.setBounce(1);
    }

    this.physics.add.collider(coins, ground);
    this.physics.add.overlap(player, coins, collectCoin, null, this);

    text = this.add.text(10,10,"⭐ 0",{fontSize:"20px",fill:"#000"});
    this.add.text(70,40,"Gael Herói 💖",{fontSize:"22px",fill:"#000"});
}

function update(){

    if(moveDir === -1){
        player.setVelocityX(-160);
    }
    else if(moveDir === 1){
        player.setVelocityX(160);
    }
    else{
        player.setVelocityX(0);
    }
}

// parar movimento quando soltar botão
document.addEventListener("touchend",()=> moveDir = 0);
document.addEventListener("mouseup",()=> moveDir = 0);

function collectCoin(player, coin){
    coin.disableBody(true,true);
    stars++;
    text.setText("⭐ "+stars);
    speak("Muito bem Gael!");
}

</script>

</body>
</html>
