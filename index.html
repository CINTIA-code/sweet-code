<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corredor Gaélico 🏃⚽</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(to top,#1e3c72,#2a5298);
}

#game{
    position:relative;
    width:900px;
    max-width:95%;
    height:500px;
    overflow:hidden;
    border-radius:15px;
    background:linear-gradient(to top,#2e7d32 80px,#0d47a1);
}

#ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:80px;
    background:#1b5e20;
}

#player{
    position:absolute;
    bottom:80px;
    left:80px;
    width:200px;
}

.obstacle{
    position:absolute;
    bottom:80px;
    right:-60px;
    width:50px;
}

#score{
    position:absolute;
    top:20px;
    left:20px;
    font-size:22px;
    color:white;
}

#phase{
    position:absolute;
    top:20px;
    right:20px;
    font-size:22px;
    color:white;
}

#message{
    position:absolute;
    top:40%;
    width:100%;
    text-align:center;
    font-size:40px;
    color:white;
    display:none;
}
</style>
</head>

<body>

<div id="game">
    <div id="score">Pontos: 0</div>
    <div id="phase">Fase 1</div>
    <div id="message"></div>
    <img id="player" src="gael.png">
    <div id="ground"></div>
</div>

<script>
let player = document.getElementById("player");
let scoreDisplay = document.getElementById("score");
let phaseDisplay = document.getElementById("phase");
let message = document.getElementById("message");

let score = 0;
let phase = 1;
let speed = 3; // começa bem devagar
let isJumping = false;
let running = true;

document.addEventListener("touchstart", jump);
document.addEventListener("keydown", jump);

function jump(){
    if(isJumping || !running) return;
    isJumping = true;

    let height = 0;

    let up = setInterval(function(){
        if(height >= 150){
            clearInterval(up);

            let down = setInterval(function(){
                if(height <= 0){
                    clearInterval(down);
                    isJumping = false;
                }
                height -= 5;
                player.style.bottom = (80 + height) + "px";
            },20);

        }else{
            height += 5;
            player.style.bottom = (80 + height) + "px";
        }
    },20);
}

function createObstacle(){
    if(!running) return;

    let obstacle = document.createElement("img");
    obstacle.src = "https://cdn-icons-png.flaticon.com/512/53/53283.png";
    obstacle.classList.add("obstacle");
    document.getElementById("game").appendChild(obstacle);

    let move = setInterval(function(){
        let right = parseInt(getComputedStyle(obstacle).right);
        obstacle.style.right = (right + speed) + "px";

        if(right > 900){
            obstacle.remove();
            clearInterval(move);
        }

        let playerBottom = parseInt(getComputedStyle(player).bottom);

        if(right > 600 && right < 760 && playerBottom < 150){
            running = false;
            message.innerText = "💥 GAME OVER 💥";
            message.style.display = "block";
        }

    },20);
}

setInterval(createObstacle, 3000);

setInterval(function(){
    if(!running) return;

    score++;
    scoreDisplay.innerText = "Pontos: " + score;

    if(score >= 100 && phase === 1){
        phase = 2;
        speed = 4;
        phaseDisplay.innerText = "Fase 2";
    }

    if(score >= 150 && phase === 2){
        phase = 3;
        speed = 5;
        phaseDisplay.innerText = "Fase 3";
    }

    if(score >= 300){
        running = false;
        message.innerText = "🏆 GAEL CAMPEÃO! 🏆";
        message.style.display = "block";
    }

},300);
</script>

</body>
</html>
