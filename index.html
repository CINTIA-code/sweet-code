<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gael Runner 🏃⚽</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
}

#game {
    position: relative;
    width: 900px;
    max-width: 95%;
    height: 500px;
    overflow: hidden;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

#ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 60px;
    background: #1b5e20;
}

#player {
    position: absolute;
    bottom: 60px;
    left: 80px;
    width: 180px;
}

.obstacle {
    position: absolute;
    bottom: 60px;
    right: -60px;
    width: 50px;
}

#score {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 22px;
}

#phase {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 22px;
}

#message {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    font-size: 40px;
    display: none;
}
</style>
</head>

<body>

<div id="game">
    <div id="score">Pontos: 0</div>
    <div id="phase">Fase 1</div>
    <div id="message"></div>
    <img id="player" src="gael.png">
    <div id="ground"></div>
</div>

<script>
let player = document.getElementById("player");
let scoreDisplay = document.getElementById("score");
let phaseDisplay = document.getElementById("phase");
let message = document.getElementById("message");

let score = 0;
let isJumping = false;
let speed = 4; // mais lento
let phase = 1;
let gameRunning = true;

document.addEventListener("touchstart", jump);
document.addEventListener("keydown", jump);

function jump() {
    if (isJumping || !gameRunning) return;
    isJumping = true;

    let up = 0;
    let jumpInterval = setInterval(function() {
        if (up >= 140) {
            clearInterval(jumpInterval);

            let downInterval = setInterval(function() {
                if (up <= 0) {
                    clearInterval(downInterval);
                    isJumping = false;
                }
                up -= 5;
                player.style.bottom = (60 + up) + "px";
            }, 20);

        } else {
            up += 5;
            player.style.bottom = (60 + up) + "px";
        }
    }, 20);
}

function createObstacle() {
    if (!gameRunning) return;

    let obstacle = document.createElement("img");
    obstacle.src = "https://cdn-icons-png.flaticon.com/512/53/53283.png";
    obstacle.classList.add("obstacle");
    document.getElementById("game").appendChild(obstacle);

    let move = setInterval(function() {
        let obstacleRight = parseInt(getComputedStyle(obstacle).right);
        obstacle.style.right = obstacleRight + speed + "px";

        if (obstacleRight > window.innerWidth) {
            obstacle.remove();
            clearInterval(move);
        }

        let playerBottom = parseInt(getComputedStyle(player).bottom);

        if (
            obstacleRight > 650 &&
            obstacleRight < 800 &&
            playerBottom < 120
        ) {
            gameRunning = false;
            message.innerText = "💥 GAME OVER 💥";
            message.style.display = "block";
        }

    }, 20);
}

setInterval(createObstacle, 2500);

setInterval(function() {
    if (!gameRunning) return;

    score++;
    scoreDisplay.innerText = "Pontos: " + score;

    if (score >= 100 && phase === 1) {
        phase = 2;
        speed = 6;
        phaseDisplay.innerText = "Fase 2";
    }

    if (score >= 150 && phase === 2) {
        phase = 3;
        speed = 8;
        phaseDisplay.innerText = "Fase 3";
    }

    if (score >= 300) {
        gameRunning = false;
        message.innerText = "🏆 GAEL CAMPEÃO! 🏆";
        message.style.display = "block";
    }

}, 200);
</script>

</body>
</html>
