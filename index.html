<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gael 💖</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(#ffecd2,#fcb69f);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#game{
    width:95%;
    max-width:500px;
    background:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
}

img{
    width:120px;
    margin:10px;
}

button{
    padding:12px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:#ff7a18;
    color:white;
    font-size:16px;
}

#message{
    margin-top:10px;
    font-size:15px;
    color:#555;
}
</style>
</head>

<body>

<div id="game">

<h2>💖 Brincando com o Gael</h2>

<img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png">

<p id="text">O que você quer fazer agora?</p>

<div id="actions"></div>

<p id="message"></p>

</div>

<audio id="music" src="https://www.myinstants.com/media/sounds/kids-song.mp3"></audio>

<script>

function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "pt-BR";
    speechSynthesis.speak(msg);
}

const actions = document.getElementById("actions");
const message = document.getElementById("message");

// AÇÕES (SEM CERTO OU ERRADO)
const options = [
    {
        text: "🤗 Abraçar",
        action: () => {
            message.innerText = "Que gostoso um abraço! 💖";
            speak("Abraçar é muito bom!");
        }
    },
    {
        text: "👋 Dar a mão",
        action: () => {
            message.innerText = "Segurar a mão mostra carinho 🤝";
            speak("Muito bonito dar a mão!");
        }
    },
    {
        text: "🗣️ Falar amigo",
        action: () => {
            message.innerText = "Ser amigo é muito especial 💛";
            speak("Você é um bom amigo!");
        }
    },
    {
        text: "💖 Fazer carinho",
        action: () => {
            message.innerText = "Carinho deixa o coração feliz 🥰";
            speak("Carinho é amor!");
        }
    },
    {
        text: "🎵 Cantar",
        action: () => {
            message.innerText = "🎶 Vamos cantar juntos!";
            speak("Vamos cantar Gael!");
            document.getElementById("music").play();
        }
    }
];

// CRIAR BOTÕES
options.forEach(opt=>{
    let btn = document.createElement("button");
    btn.innerText = opt.text;
    btn.onclick = opt.action;
    actions.appendChild(btn);
});

</script>

</body>
</html>
