<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gael - Herói do Amor</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(#4facfe,#00f2fe);
    overflow:hidden;
}

#game{
    width:100%;
    max-width:500px;
    height:100vh;
    margin:auto;
    background:white;
    position:relative;
    overflow:hidden;
}

#hud{
    display:flex;
    justify-content:space-between;
    padding:10px;
    font-size:18px;
}

#hero{
    width:90px;
    position:absolute;
    bottom:20px;
    left:20px;
    transition:0.2s;
}

.jump{
    transform:translateY(-40px);
}

.coin{
    width:40px;
    position:absolute;
    bottom:40px;
}

#storyBox{
    position:absolute;
    bottom:0;
    width:100%;
    background:white;
    padding:15px;
    text-align:center;
    border-top:2px solid #ddd;
}

button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:#ff9800;
    color:white;
}
</style>
</head>

<body>

<div id="game">

<div id="hud">
    <div id="stars">⭐ 0</div>
</div>

<img id="hero" src="https://cdn-icons-png.flaticon.com/512/1998/1998610.png">

<div id="storyBox">
    <p id="story">Gael é um pequeno herói! Vamos começar a aventura 💖</p>
    <div id="actions"></div>
</div>

</div>

<script>

let stars = 0;
let phase = 1;

const story = document.getElementById("story");
const actions = document.getElementById("actions");
const hero = document.getElementById("hero");

function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "pt-BR";
    speechSynthesis.speak(msg);
}

function updateStars(){
    document.getElementById("stars").innerText = "⭐ " + stars;
}

// ===== ANIMAÇÃO PULO =====
function jump(){
    hero.classList.add("jump");
    setTimeout(()=> hero.classList.remove("jump"),300);
}

// ===== FASE AVENTURA =====
function runPhase(){

    story.innerText = "🏃 Pegue as moedas Gael!";
    speak("Vamos correr Gael!");

    actions.innerHTML = "";

    let count = 0;

    let interval = setInterval(()=>{

        let coin = document.createElement("img");
        coin.src = "https://cdn-icons-png.flaticon.com/512/138/138292.png";
        coin.className = "coin";
        coin.style.left = "100%";

        game.appendChild(coin);

        let pos = 100;

        let move = setInterval(()=>{
            pos -= 3;
            coin.style.left = pos + "%";

            if(pos < 15){
                stars++;
                updateStars();
                jump();
                coin.remove();
                clearInterval(move);
            }

        },30);

        count++;

        if(count > 8){
            clearInterval(interval);
            setTimeout(next,1500);
        }

    },700);
}

// ===== QUIZ =====
function question(text, options, correct, success){

    story.innerText = text;
    speak(text);

    actions.innerHTML = "";

    options.forEach(opt=>{
        let btn = document.createElement("button");
        btn.innerText = opt;

        btn.onclick = ()=>{
            if(opt === correct){
                stars++;
                updateStars();
                speak(success);
                next();
            }else{
                speak("Vamos tentar de novo");
            }
        };

        actions.appendChild(btn);
    });
}

// ===== CONTROLE =====
function next(){
    phase++;

    if(phase === 2){
        question(
            "Pode correr dentro de casa?",
            ["SIM","NÃO"],
            "NÃO",
            "Muito bem Gael!"
        );
    }

    else if(phase === 3){
        question(
            "Devemos respeitar a mamãe?",
            ["SIM","NÃO"],
            "SIM",
            "Você é um herói do amor!"
        );
    }

    else if(phase === 4){
        question(
            "Clique na letra G",
            ["A","G","B"],
            "G",
            "Perfeito!"
        );
    }

    else if(phase === 5){
        question(
            "Ser forte é bater?",
            ["SIM","NÃO"],
            "NÃO",
            "Ser forte é cuidar!"
        );
    }

    else{
        story.innerText = "🏆 Gael virou um HERÓI!";
        speak("Parabéns Gael, você é incrível!");

        actions.innerHTML = "<button onclick='location.reload()'>Jogar de novo</button>";
    }
}

// iniciar
runPhase();
updateStars();

</script>

</body>
</html>
