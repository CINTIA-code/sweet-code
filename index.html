<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missão do Pequeno Herói</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#game{
    background:white;
    width:95%;
    max-width:520px;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

#stars{
    font-size:20px;
    margin-bottom:10px;
}

#gael{
    width:130px;
    margin:15px 0;
    transition:0.3s;
}

.run{
    animation: runAnim 0.3s infinite alternate;
}

@keyframes runAnim{
    from{ transform: translateX(-5px); }
    to{ transform: translateX(5px); }
}

button{
    padding:12px 18px;
    margin:6px;
    font-size:16px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#125ea8;
}
</style>
</head>

<body>

<div id="game">
    <div id="stars">⭐ 0</div>
    <h2 id="title">Missão 1</h2>
    <img id="gael" src="gael.png">
    <div id="content"></div>
</div>

<audio id="clap" src="https://www.myinstants.com/media/sounds/kids-cheering.mp3"></audio>

<script>

const game = {
    phase: 1,
    stars: 0,

    updateStars(){
        document.getElementById("stars").innerText = "⭐ " + this.stars;
    },

    next(){
        this.phase++;
        this.load();
    },

    load(){
        const title = document.getElementById("title");
        const content = document.getElementById("content");
        const gael = document.getElementById("gael");

        content.innerHTML = "";

        if(this.phase === 1){
            title.innerText = "Missão 1 – Segurança";
            gael.classList.add("run");

            setTimeout(() => {
                gael.classList.remove("run");
                title.innerText = "⚠️ Devemos correr dentro de casa?";

                let sim = document.createElement("button");
                sim.innerText = "SIM";

                let nao = document.createElement("button");
                nao.innerText = "NÃO";

                nao.onclick = () => {
                    this.stars++;
                    this.updateStars();
                    document.getElementById("clap").play();
                    this.next();
                };

                content.appendChild(sim);
                content.appendChild(nao);

            },2000);
        }

        else if(this.phase === 2){
            title.innerText = "Missão 2 – Conhecimento";

            let question = document.createElement("p");
            question.innerText = "Clique na letra G";

            let letters = ["A","G","B","C"];

            letters.forEach(letter=>{
                let btn = document.createElement("button");
                btn.innerText = letter;

                btn.onclick = () =>{
                    if(letter === "G"){
                        this.stars++;
                        this.updateStars();
                        document.getElementById("clap").play();
                        this.next();
                    }
                }

                content.appendChild(btn);
            });

            content.prepend(question);
        }

        else if(this.phase === 3){
            title.innerText = "Missão 3 – Respeito";

            let question = document.createElement("p");
            question.innerText = "Devemos respeitar a mamãe?";

            let sim = document.createElement("button");
            sim.innerText = "SIM";

            sim.onclick = () => {
                this.stars++;
                this.updateStars();
                document.getElementById("clap").play();
                this.next();
            }

            content.appendChild(question);
            content.appendChild(sim);
        }

        else{
            title.innerText = "🏆 Missão Concluída!";
            content.innerHTML = "<h3>Você ganhou "+this.stars+" estrelas!</h3>";
        }
    }
};

game.load();

</script>

</body>
</html>
