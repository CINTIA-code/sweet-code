<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gael Aprende Brincando</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(to top,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

#game{
    background:white;
    padding:25px;
    border-radius:20px;
    width:95%;
    max-width:500px;
    position:relative;
}

h2{
    margin-bottom:15px;
}

#gael{
    width:130px;
    margin:15px 0;
}

/* Corrida */
.run{
    animation: runAnim 0.3s infinite alternate;
}

@keyframes runAnim{
    from{ transform: translateX(-5px); }
    to{ transform: translateX(5px); }
}

button{
    margin:8px;
    padding:12px 18px;
    font-size:16px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#125ea8;
}

#stars{
    font-size:20px;
    margin-bottom:10px;
}

</style>
</head>

<body>

<div id="game">
    <div id="stars">⭐ 0</div>
    <h2 id="title">Fase 1 – Corrida</h2>
    <img id="gael" src="gael.png">
    <div id="content"></div>
</div>

<audio id="clapSound" src="https://www.myinstants.com/media/sounds/kids-cheering.mp3"></audio>

<script>

let phase = 1;
let stars = 0;

const title = document.getElementById("title");
const content = document.getElementById("content");
const gael = document.getElementById("gael");
const starsDisplay = document.getElementById("stars");
const clapSound = document.getElementById("clapSound");

function updateStars(){
    starsDisplay.innerText = "⭐ " + stars;
}

function nextPhase(){
    phase++;
    if(phase === 2){
        loadPhase2();
    } else if(phase === 3){
        loadPhase3();
    } else {
        showFinal();
    }
}

/* FASE 1 */
function loadPhase1(){
    title.innerText = "Fase 1 – Corrida";
    content.innerHTML = "";
    gael.classList.add("run");

    setTimeout(() => {
        title.innerText = "⚠️ Cuidado para não se machucar!";
        gael.classList.remove("run");

        let btn = document.createElement("button");
        btn.innerText = "Respeitar orientação";
        btn.onclick = function(){
            stars++;
            updateStars();
            clapSound.play();
            nextPhase();
        }
        content.appendChild(btn);

    }, 3000);
}

/* FASE 2 */
function loadPhase2(){
    title.innerText = "Fase 2 – Clique na letra G";
    content.innerHTML = "";

    let options = ["A","G","B","C"];

    options.forEach(letter => {
        let btn = document.createElement("button");
        btn.innerText = letter;

        btn.onclick = function(){
            if(letter === "G"){
                stars++;
                updateStars();
                clapSound.play();
                nextPhase();
            }
        }

        content.appendChild(btn);
    });
}

/* FASE 3 */
function loadPhase3(){
    title.innerText = "Fase 3 – Devemos respeitar a mamãe?";
    content.innerHTML = "";

    let sim = document.createElement("button");
    sim.innerText = "SIM";

    sim.onclick = function(){
        stars++;
        updateStars();
        clapSound.play();
        nextPhase();
    }

    let nao = document.createElement("button");
    nao.innerText = "NÃO";

    content.appendChild(sim);
    content.appendChild(nao);
}

/* FINAL */
function showFinal(){
    title.innerText = "🏆 Parabéns Gael!";
    content.innerHTML = "<h3>Você ganhou " + stars + " estrelas!</h3>";
}

loadPhase1();

</script>

</body>
</html>
