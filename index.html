<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missão do Gael Herói</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#game{
    background:white;
    width:95%;
    max-width:520px;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

#top{
    display:flex;
    justify-content:space-between;
    font-size:18px;
}

#gael{
    width:140px;
    margin:15px 0;
    transition:0.3s;
}

.jump{
    animation: jump 0.4s;
}

@keyframes jump{
    0%{ transform: translateY(0); }
    50%{ transform: translateY(-20px); }
    100%{ transform: translateY(0); }
}

button{
    padding:12px 18px;
    margin:6px;
    font-size:16px;
    border:none;
    border-radius:10px;
    background:#ff7a18;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#e65100;
}

.correct{
    background:green !important;
}

.wrong{
    background:red !important;
}
</style>
</head>

<body>

<div id="game">
    <div id="top">
        <div id="stars">⭐ 0</div>
        <div id="life">❤️ 3</div>
    </div>

    <h2 id="title">Missão do Gael</h2>

    <img id="gael" src="gael.png">

    <div id="content"></div>
</div>

<audio id="win" src="https://www.myinstants.com/media/sounds/tada-fanfare.mp3"></audio>
<audio id="error" src="https://www.myinstants.com/media/sounds/error.mp3"></audio>

<script>

const game = {
    phase: 1,
    stars: 0,
    life: 3,

    updateUI(){
        document.getElementById("stars").innerText = "⭐ " + this.stars;
        document.getElementById("life").innerText = "❤️ " + this.life;
    },

    correct(btn){
        btn.classList.add("correct");
        document.getElementById("win").play();
        this.stars++;
        document.getElementById("gael").classList.add("jump");

        setTimeout(()=>{
            document.getElementById("gael").classList.remove("jump");
            this.next();
        },800);
    },

    wrong(btn){
        btn.classList.add("wrong");
        document.getElementById("error").play();
        this.life--;

        this.updateUI();

        if(this.life <= 0){
            this.gameOver();
        }
    },

    next(){
        this.phase++;
        this.updateUI();
        this.load();
    },

    gameOver(){
        document.getElementById("title").innerText = "😢 Game Over";
        document.getElementById("content").innerHTML =
        `<h3>O Gael precisa de você!</h3>
         <button onclick="location.reload()">Tentar de novo</button>`;
    },

    load(){
        const title = document.getElementById("title");
        const content = document.getElementById("content");

        content.innerHTML = "";

        if(this.phase === 1){
            title.innerText = "Missão 1 🚫";

            let q = document.createElement("p");
            q.innerText = "Pode correr dentro de casa?";

            ["SIM","NÃO"].forEach(text=>{
                let btn = document.createElement("button");
                btn.innerText = text;

                btn.onclick = ()=>{
                    text === "NÃO" ? this.correct(btn) : this.wrong(btn);
                }

                content.appendChild(btn);
            });

            content.prepend(q);
        }

        else if(this.phase === 2){
            title.innerText = "Missão 2 🔤";

            let q = document.createElement("p");
            q.innerText = "Onde está a letra G?";

            ["A","G","C","B"].forEach(letter=>{
                let btn = document.createElement("button");
                btn.innerText = letter;

                btn.onclick = ()=>{
                    letter === "G" ? this.correct(btn) : this.wrong(btn);
                }

                content.appendChild(btn);
            });

            content.prepend(q);
        }

        else if(this.phase === 3){
            title.innerText = "Missão 3 ❤️";

            let q = document.createElement("p");
            q.innerText = "Devemos respeitar a mamãe?";

            ["SIM","NÃO"].forEach(text=>{
                let btn = document.createElement("button");
                btn.innerText = text;

                btn.onclick = ()=>{
                    text === "SIM" ? this.correct(btn) : this.wrong(btn);
                }

                content.appendChild(btn);
            });

            content.prepend(q);
        }

        else{
            title.innerText = "🏆 VITÓRIA!";
            content.innerHTML =
            `<h2>Gael salvou o dia! 🎉</h2>
             <p>Você fez ${this.stars} estrelas!</p>
             <button onclick="location.reload()">Jogar novamente</button>`;
        }
    }
};

game.updateUI();
game.load();

</script>

</body>
</html>
