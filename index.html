<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#4facfe;
}

#gael{
    width:150px;
    animation: clap 0.5s infinite alternate;
}

@keyframes clap{
    from{ transform: rotate(-5deg); }
    to{ transform: rotate(5deg); }
}
</style>
</head>

<body>

<img id="gael" src="gael.png">

</body>
</html>
